<!-- LOGIN PAGE - UPDATED AS PER YOUR POLICY -->
<div id="loginPage">
<div class="box" style="width:100%;max-width:400px">
<div class="logo" style="text-align:center;margin-bottom:10px;font-size:32px">Skate <span>Cart</span></div>
<h2 id="logTitle" style="text-align:center">Create Account</h2>
<p style="text-align:center;font-size:11px;color:#64748b">Policy: Facebook Group Link Lazmi Hai</p>

<input id="fName" class="inp" placeholder="First Name">
<input id="lName" class="inp" placeholder="Last Name">
<input id="lEmail" class="inp" placeholder="Gmail - example@gmail.com">
<input id="lPass" type="password" class="inp" placeholder="Password">
<input id="fbLink" class="inp" placeholder="Facebook Group Link - https://facebook.com/groups/...">
<label style="font-size:11px;color:#334155;display:flex;gap:6px;margin-top:10px"><input type="checkbox" id="policyCheck"> I agree to Policy & Conditions - Minimum Payout $25, 45 Days Pending, Facebook Group Required</label>

<button class="btn" onclick="doAuth()">Create Account & Continue</button>
<p style="text-align:center;font-size:13px;margin-top:12px"><span style="color:#0d9488;font-weight:800;cursor:pointer" onclick="toggleLog()" id="logSwitch">Already have account? Sign In</span></p>
</div>
</div>

<script>
let isSignup=true; // Default Signup hi khulega aapki policy ke hisab se
function toggleLog(){
 isSignup=!isSignup;
 document.getElementById('fName').style.display=isSignup?'block':'none';
 document.getElementById('lName').style.display=isSignup?'block':'none';
 document.getElementById('fbLink').style.display=isSignup?'block':'none';
 document.getElementById('policyCheck').parentElement.style.display=isSignup?'flex':'none';
 document.getElementById('logTitle').innerText=isSignup?'Create Account':'Sign In';
 document.getElementById('logSwitch').innerText=isSignup?'Already have account? Sign In':'New user? Create Account';
}

function doAuth(){
 let fName=document.getElementById('fName').value.trim();
 let lName=document.getElementById('lName').value.trim();
 let email=document.getElementById('lEmail').value.trim().toLowerCase();
 let pass=document.getElementById('lPass').value.trim();
 let fb=document.getElementById('fbLink').value.trim();
 
 if(isSignup){
   if(!fName||!lName||!email||!pass||!fb) return alert('Bhai First Name, Last Name, Gmail, Password, Facebook Link sab likhna lazmi hai');
   if(!fb.includes('facebook.com')) return alert('Sahi Facebook Group Link dalo bhai');
   if(!document.getElementById('policyCheck').checked) return alert('Policy ko Agree karo bhai');
   
   let users=JSON.parse(localStorage.getItem('skate_users')||'[]');
   if(users.find(u=>u.email===email)) return alert('Ye Gmail pehle se hai');
   users.push({firstName:fName,lastName:lName,email,pass,fbLink:fb,fullName:fName+' '+lName});
   localStorage.setItem('skate_users',JSON.stringify(users));
   localStorage.setItem('skate_current',JSON.stringify({email,name:fName+' '+lName,fbLink:fb}));
   location.reload();
 }else{
   if(!email||!pass) return alert('Gmail / Password likho');
   let users=JSON.parse(localStorage.getItem('skate_users')||'[]');
   let f=users.find(u=>u.email===email && u.pass===pass);
   if(!f) return alert('Gmail ya Password galat hai');
   localStorage.setItem('skate_current',JSON.stringify({email:f.email,name:f.fullName,fbLink:f.fbLink}));
   location.reload();
 }
}
</script>
