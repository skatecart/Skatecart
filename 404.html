<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting to Walmart...</title>
</head>
<body style="text-align:center;padding-top:100px;font-family:Arial">
<h2>🔒 Checking Link...</h2>
<p id="msg">Redirecting to Walmart...</p>
<script>
(function(){
  var hash = location.hash.substring(1);
  var walmartUrl = "";
  if(hash){
    try { walmartUrl = atob(hash); } catch(e){}
  }
  if(walmartUrl && walmartUrl.includes("walmart.com")){
    document.getElementById("msg").innerText = "Going to Walmart...";
    window.location.replace(walmartUrl);
  }else{
    document.getElementById("msg").innerText = "Invalid Link - Please create new link";
    setTimeout(function(){ window.location.replace("/Skatecart/"); }, 2000);
  }
})();
</script>
</body>
</html>
