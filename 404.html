<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting to Walmart...</title>
</head>
<body style="text-align:center;padding-top:80px;font-family:sans-serif">
<h2>🔒 Checking Link...</h2>
<p id="msg">Walmart پر لے جایا جا رہا ہے...</p>
<script>
  let path = location.pathname;
  let id = "";
  if(path.includes("/r/")){
    id = path.split("/r/")[1].split("/")[0].split("?")[0].split("#")[0].toUpperCase();
  }
  if(!id){
    document.getElementById("msg").innerText = "Invalid Link";
  } else {
    fetch("https://kvdb.io/SkateCartPro_786/" + id)
   .then(r => {
      if(!r.ok) throw "not found";
      return r.text();
    })
   .then(url => {
      url = url.trim();
      if(url.startsWith("http")){
        window.location.href = url;
      } else {
        document.getElementById("msg").innerText = "Link Expired: " + id;
      }
    })
   .catch(()=>{
      document.getElementById("msg").innerText = "Link not found: " + id;
    });
  }
</script>
</body>
</html>
