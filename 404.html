<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checking...</title>
<style>
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:#fff;font-family:system-ui,Arial;color:#555}
.box{text-align:center;font-size:14px;line-height:28px}
</style>
</head>
<body>
<div class="box">
<div>🔒 Checking for traffic security...</div>
<div>🛡️ Verifying your connection...</div>
<div>🛡️ Redirecting...</div>
<div id="s" style="font-size:12px;color:#999;margin-top:10px"></div>
</div>
<script>
var c=location.pathname.split('/').pop().split('?')[0];
var K="https://kvdb.io/SkQ7vB9p2R4t6Y8w";
fetch(K+"/"+c).then(r=>r.text()).then(u=>{
  u=u.trim().replace(/"/g,'');
  if(u.indexOf("walmart.com")>-1){
    if(u.indexOf("http")!==0) u="https://"+u;
    setTimeout(()=>{location.replace(u)},1200);
  }else{
    document.getElementById("s").innerText="Invalid link: "+c;
  }
});
</script>
</body>
</html>
