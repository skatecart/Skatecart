<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Redirecting...</title></head>
<body style="text-align:center;padding-top:80px;font-family:Arial">
<h2>🔒 Checking Link...</h2><p id="msg">Please wait...</p>
<script>
(function(){
  try{
    var h = location.hash.substring(1);
    if(h){
      var url = "";
      try{ url = atob(h); }catch(e){}
      if(url && url.includes("walmart.com")){
        document.getElementById("msg").innerText="Redirecting to Walmart...";
        location.replace(url);
        return;
      }
    }
    var p = location.pathname.split("/r/")[1] || "";
    var sid = p.split("/")[0].split("?")[0];
    if(sid){
      fetch("https://kvdb.io/SkateCartPro_786/"+sid).then(r=>r.text()).then(u=>{
        if(u && u.includes("walmart.com")) location.replace(u);
        else throw 1;
      }).catch(()=>{
        document.getElementById("msg").innerText="Link not found - please generate new link";
        setTimeout(()=>location.replace("/Skatecart/"),2000);
      });
    }else{
      document.getElementById("msg").innerText="Invalid Link";
    }
  }catch(e){
    location.replace("/Skatecart/");
  }
})();
</script></body></html>
