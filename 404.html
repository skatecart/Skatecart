<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redirecting...</title><style>body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial}.box{text-align:center}</style></head><body><div class="box"><div>🔒 Checking for traffic security...</div><div>🛡️ Verifying your connection...</div><div>🚀 Redirecting to Walmart...</div><div id="msg" style="color:red;margin-top:10px"></div></div><script>
var BUCKET = "YAHAN_APNA_NAYA_KVDB_LINK_DALO"; // <-- YAHAN
var code = location.pathname.split("/").pop().split("?")[0];
fetch(BUCKET+"/"+code).then(r=>r.text()).then(l=>{
  l=l.trim().replace(/"/g,'');
  if(l.startsWith("http")) location.replace(l);
  else document.getElementById("msg").innerText="Invalid Link: "+code+" - Dashboard se naya link banao";
});
</script></body></html>
