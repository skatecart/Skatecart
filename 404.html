<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redirecting...</title><style>body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial;background:#fff}.box{text-align:center;line-height:38px;font-weight:700}.loader{width:42px;height:42px;border:4px solid #eee;border-top:4px solid #0f766e;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 15px}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="loader"></div><div>🔒 Checking for traffic security...</div><div>🛡️ Verifying your connection...</div><div>🚀 Redirecting...</div><div id="err" style="display:none;color:red;font-size:13px;margin-top:10px"></div></div><script>
var BUCKET="SkateCartPro_786";
var code=location.pathname.split("/").pop().split("?")[0].trim();
function go(url){setTimeout(function(){location.replace(url)},1200);}
// اگر کوڈ چھوٹا ہے جیسے 0FSJZCIQ تو kvdb سے لاؤ
if(code.length<=10){
  fetch("https://kvdb.io/"+BUCKET+"/"+code.toUpperCase(),{cache:"no-store"}).then(r=>r.text()).then(u=>{
    if(u && u.indexOf("http")==0) go(u);
    else{ // اگر چھوٹی لنک نہ ملے تو base64 سمجھ کے ٹرائی کرو
      tryBase64();
    }
  }).catch(tryBase64);
}else{ tryBase64(); }

function tryBase64(){
  try{
    var b64=code.replace(/-/g,'+').replace(/_/g,'/');
    while(b64.length%4) b64+='=';
    var link=atob(b64);
    if(link.startsWith("http")) go(link);
    else throw "invalid";
  }catch(e){
    document.getElementById("err").style.display="block";
    document.getElementById("err").innerText="Invalid or Expired Link: "+code;
  }
}
</script></body></html>
