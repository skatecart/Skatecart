<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting...</title>
<style>
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:#fff;font-family:Arial;color:#666}
.box{text-align:center;line-height:32px;font-size:16px}
.loader{width:35px;height:35px;border:3px solid #eee;border-top:3px solid #0071dc;border-radius:50%;margin:0 auto 20px;animation:spin 0.8s linear infinite}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
<div class="loader"></div>
🔒 Checking for traffic security...<br>
🛡️ Verifying your connection...<br>
<span id="t">Redirecting...</span>
</div>
<script>
var code = window.location.pathname.split('/').pop().split('?')[0];
var KVDB = "https://kvdb.io/9f8e7d6c5b4a";
if(code.length>2){
  fetch(KVDB + "/" + code)
 .then(r=>r.text())
 .then(u=>{
    u=u.trim().replace(/"/g,'');
    if(u.length>5){
      document.getElementById("t").innerHTML="Redirecting to Walmart...";
      setTimeout(function(){
        if(u.indexOf("http")!==0) u="https://"+u;
        window.location.replace(u);
      },1500);
    } else {
      document.getElementById("t").innerHTML="Invalid Link";
    }
  });
}
</script>
</body>
</html>
