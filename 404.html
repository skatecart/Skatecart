<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting...</title>
</head>
<body style="text-align:center;padding-top:80px;font-family:Inter,Arial">
<h2>🔒 Checking Link...</h2>
<p id="msg">Please wait...</p>
<script>
let sid = location.pathname.split("/r/")[1];
if(sid) sid = sid.split("/")[0].split("?")[0].split("&")[0];
if(!sid){
  document.getElementById("msg").innerText="Invalid Link";
  setTimeout(()=>{ location.href="/Skatecart/"; },1500);
}else{
  fetch("https://kvdb.io/SkateCartPro_786/"+sid)
 .then(r=>{ if(!r.ok) throw "notfound"; return r.text(); })
 .then(url=>{
    if(url && url.includes("walmart.com")){
      document.getElementById("msg").innerText="Redirecting to Walmart...";
      location.href = url;
    }else{
      throw "invalid";
    }
  })
 .catch(e=>{
    document.getElementById("msg").innerText="Link expired or not found";
    setTimeout(()=>{ location.href="/Skatecart/"; },2000);
  });
}
</script>
</body>
</html>
