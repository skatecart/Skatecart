<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skatecart Admin Panel</title>
<style>
body{margin:0;font-family:system-ui;background:#0f0f0f;color:white}
#loginBox{height:100vh;display:flex;align-items:center;justify-content:center}
.login-card{background:white;color:black;padding:25px;border-radius:16px;width:90%;max-width:340px;text-align:center}
.login-card input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc;font-size:16px;box-sizing:border-box}
.login-card button{width:100%;padding:12px;background:black;color:white;border:none;border-radius:8px;font-weight:bold}
#adminPanel{display:none;padding:15px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:15px}
.stat{background:#1f1f1f;padding:12px;border-radius:12px;text-align:center}
.stat b{font-size:20px;display:block;color:#00ff88}
.user-card{background:#1f1f1f;padding:12px;border-radius:12px;margin-bottom:10px;border-left:4px solid #ffcc00}
.user-card.approved{border-left-color:#00ff88}
.user-card.rejected{border-left-color:#ff4444}
.btn{padding:6px 12px;border:none;border-radius:6px;font-weight:bold;margin-right:5px}
.approve{background:#00ff88;color:black}
.reject{background:#ff4444;color:white}
</style>
</head>
<body>
<div id="loginBox">
  <div class="login-card">
    <h2>🔒 Admin Login</h2>
    <input id="u" placeholder="Username">
    <input id="p" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="err" style="color:red;display:none">غلط Password</p>
  </div>
</div>
<div id="adminPanel">
  <h2>Skatecart Admin</h2>
  <div class="stats">
    <div class="stat"><b id="total">0</b>Total</div>
    <div class="stat"><b id="pending">0</b>Pending</div>
    <div class="stat"><b id="approved">0</b>Approved</div>
  </div>
  <div id="list"></div>
</div>
<script>
const ADMIN_U="admin"; const ADMIN_P="Haresh@123";
function login(){
 if(document.getElementById('u').value===ADMIN_U && document.getElementById('p').value===ADMIN_P){
  localStorage.setItem('skate_admin_login','true'); showAdmin();
 }else{document.getElementById('err').style.display='block';}
}
function showAdmin(){
 document.getElementById('loginBox').style.display='none';
 document.getElementById('adminPanel').style.display='block';
 loadUsers();
}
if(localStorage.getItem('skate_admin_login')==='true'){showAdmin();}
function loadUsers(){
 let users=JSON.parse(localStorage.getItem('skatecart_users')||'[]');
 document.getElementById('total').innerText=users.length;
 document.getElementById('pending').innerText=users.filter(u=>u.status==='pending').length;
 document.getElementById('approved').innerText=users.filter(u=>u.status==='approved').length;
 let h='';
 users.forEach((u,i)=>{
  h+=`<div class="user-card ${u.status}"><b>${u.name}</b> - ${u.email}<br>
  Status: ${u.status}<br><br>
  <button class="btn approve" onclick="setStatus(${i},'approved')">Approve</button>
  <button class="btn reject" onclick="setStatus(${i},'rejected')">Reject</button></div>`;
 });
 document.getElementById('list').innerHTML=h;
}
function setStatus(i,s){
 let users=JSON.parse(localStorage.getItem('skatecart_users')||'[]');
 users[i].status=s; localStorage.setItem('skatecart_users',JSON.stringify(users)); loadUsers();
}
</script>
</body>
</html>
